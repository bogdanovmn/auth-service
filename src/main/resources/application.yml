management:
  endpoints.web.exposure.include: prometheus, health, metrics
  prometheus.metrics.export.enabled: 'true'
  metrics:
    enable:
      jvm: 'true'
      percentiles-histogram:
        http.server.requests: 'true'

security.roles.application-id-prefix: auth

# Origins allowed to call the API from a browser. In production the front is
# served from the same origin (VITE_SSO_SERVICE_URL=/sso/api), so CORS isn't
# needed there at all and these lists stay empty. They exist for the local dev
# setup, where the front runs on the vite dev server.
# Patterns, not exact origins: the dev server takes the next free port when
# 5173 is already taken, and "[*]" is the port wildcard.
# Override per environment:
#   SECURITY_CORS_ALLOWED_ORIGINS=https://a.ru,https://b.ru
#   SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS=https://*.a.ru
security.cors.allowed-origin-patterns:
  - http://localhost:[*]
  - http://127.0.0.1:[*]

security.login-attempt:
  enabled: true
  max-failures: 7
  window-in-seconds: 900
  base-lock-in-seconds: 60
  max-lock-in-seconds: 3600
  max-tracked-emails: 1000

jwt:
  reset-password:
    ttl-in-hours: 1

spring:
  application.name: auth-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  datasource:
    url: jdbc:postgresql://hserver:5432/auth
    username: root
    password: 123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  liquibase:
    enabled: true
    change-log: classpath:migration/db/changelog.xml
