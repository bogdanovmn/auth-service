management:
  endpoints.web.exposure.include: prometheus, health, metrics
  prometheus.metrics.export.enabled: 'true'
  metrics:
    enable:
      jvm: 'true'
      percentiles-histogram:
        http.server.requests: 'true'

security.roles.application-id-prefix: auth

security.login-attempt:
  enabled: true
  max-failures: 7
  window-in-seconds: 900
  base-lock-in-seconds: 60
  max-lock-in-seconds: 3600
  max-tracked-emails: 1000

jwt:
  reset-password:
    ttl-in-hours: 1

spring:
  application.name: auth-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  datasource:
    url: jdbc:postgresql://hserver:5432/auth
    username: root
    password: 123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  liquibase:
    enabled: true
    change-log: classpath:migration/db/changelog.xml
