management:
  endpoints.web.exposure.include: prometheus, health, metrics
  prometheus.metrics.export.enabled: 'true'
  metrics:
    enable:
      jvm: 'true'
      percentiles-histogram:
        http.server.requests: 'true'

security.roles.application-id-prefix: auth

# Origins allowed to call the API from a browser. In production the front is
# served from the same origin (VITE_SSO_SERVICE_URL=/sso/api), so CORS isn't
# needed there at all and these lists stay empty. They exist for the local dev
# setup, where the front runs on the vite dev server.
# Patterns, not exact origins: the dev server takes the next free port when
# 5173 is already taken, and "[*]" is the port wildcard.
# Override per environment:
#   SECURITY_CORS_ALLOWED_ORIGINS=https://a.ru,https://b.ru
#   SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS=https://*.a.ru
security.cors:
  allowed-origins: []
  allowed-origin-patterns:
    - http://localhost:[*]
    - http://127.0.0.1:[*]
  allowed-methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
  exposed-headers:
    - Retry-After
  allow-credentials: true
  max-age: 1800

security.login-attempt:
  enabled: true
  max-failures: 7
  window-in-seconds: 900
  base-lock-in-seconds: 60
  max-lock-in-seconds: 3600
  max-tracked-emails: 1000

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  ttl-in-minutes: 30
  refresh-token:
    ttl-in-hours: 720
  reset-password:
    ttl-in-hours: 1

cache.temporary-code:
  ttl-in-sec: 10

auth.oauth2:
  redirect-base-url: ${AUTH_OAUTH2_REDIRECT_BASE_URL:http://localhost:80}
  frontend-url: ${AUTH_OAUTH2_FRONTEND_URL:http://localhost:5174/sso/}
  state-ttl-in-seconds: 600
  providers:
    github:
      enabled: ${GITHUB_OAUTH_ENABLED:false}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      scope: read:user user:email
    vk:
      enabled: ${VK_OAUTH_ENABLED:true}
      client-id: ${VK_CLIENT_ID:}
      client-secret: ${VK_CLIENT_SECRET:}
      mode: ${VK_OAUTH_MODE:id}
      scope: email
      api-version: '5.245'
    yandex:
      enabled: ${YANDEX_OAUTH_ENABLED:true}
      client-id: ${YANDEX_CLIENT_ID:}
      client-secret: ${YANDEX_CLIENT_SECRET:}
      scope: 'login:email+login:info'

spring:
  application.name: auth-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://hserver:5432/auth
    username: root
    password: 123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  liquibase:
    enabled: true
    change-log: classpath:migration/db/changelog.xml
